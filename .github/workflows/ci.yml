name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s --health-timeout 3s --health-retries 10

    # Valores ficticios exclusivos de CI; los reales viven en .env (fuera del repo).
    env:
      OPENBLAS_NUM_THREADS: "1"
      ENVIRONMENT: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ci_db
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password_only
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-000
      JWT_ISSUER: depression-risk-api
      JWT_AUDIENCE: depression-risk-web
      JWT_EXPIRE_MINUTES: "60"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci_admin_password
      CORS_ORIGINS: '["http://localhost:5173"]'
      ARTIFACTS_DIR: ./artifacts
      MAX_UPLOAD_MB: "10"
      TRAINING_TIMEOUT_SECONDS: "900"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Instalar dependencias (lockfile)
        run: uv sync --locked --python 3.12

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type checking
        run: uv run mypy

      - name: Migraciones
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (lockfile)
        run: npm ci

      - name: Tipos sincronizados con docs/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - name: Lint y formato
        run: |
          npm run lint
          npm run format:check

      - name: Type checking
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Docker Compose + Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generar .env de prueba (secretos aleatorios, nunca versionados)
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=$(openssl rand -hex 12)/" .env

      - name: Levantar el sistema completo
        run: docker compose up -d --build --wait --wait-timeout 600

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pruebas E2E
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Logs de los servicios si algo falla
        if: failure()
        run: docker compose logs --tail 200
