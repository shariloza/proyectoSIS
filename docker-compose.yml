name: depression-risk

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: depression-risk-backend:1.0.0
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    ARTIFACTS_DIRECTORY: /app/artifacts
  volumes:
    - artifacts:/app/artifacts
  networks: [internal]

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?definir POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
    ports:
      # Solo accesible desde la máquina local, nunca expuesto a la red.
      - "127.0.0.1:${POSTGRES_PORT:?definir POSTGRES_PORT en .env}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    networks: [internal]

  api:
    <<: *backend
    # Migraciones + datos iniciales idempotentes y luego el servidor.
    command: >
      sh -c "alembic upgrade head
      && python -m app.bootstrap --seed-dataset /app/seed/student_depression_dataset.csv
      && exec uvicorn app.main:production_app --factory --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s  # el primer arranque entrena el modelo inicial
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time, sys; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  web:
    build:
      context: ./frontend
    image: depression-risk-web:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    networks: [internal]

volumes:
  pgdata:
  artifacts:

networks:
  internal:
